<!-- Desafio HTML - casa virtual






Esta é uma proposta de exercício para criar um mini jogo usando somente HTML. Nele, o jogador deve entrar em uma casa virtual e localizar um objeto específico. O jogo começa na frente da casa e é concluído quando o jogador entra em um cômodo predeterminado.

A cada rodada, o jogo exibe a localização atual do jogador (por exemplo, sala, quarto) e as opções disponíveis (tais como porta, corredor). A interação ocorre à medida que o jogador navega pelos diferentes espaços da casa.

A proposta desse exercício envolve minimizar as dicas fornecidas, desafiando você a desenvolver a experiência de forma autônoma, utilizando apenas recursos do HTML.


Você tem liberdade para dar um tema único ao seu jogo. Pode ser uma caça ao tesouro, ou você pode optar pelo tema de bombeiros. Se escolher este último, você pode iniciar o jogo da seguinte forma:

👨‍🚒 Herói das Chamas

 Você é um bravo bombeiro, sua missão é encontrar o cômodo que ainda tem uma pessoa nessa casa em chamas!



🔥 Depressa! Você está na frente da casa. O que você faz? 🔥

> Entro pela porta

> Entro pela janela



Os requisitos do jogo são:

iniciar apresentando o nome e o objetivo do jogo.
o primeiro espaço deve ser a rua
cada rodada deve apresentar o espaço atual e as opções obedecendo o mapa acima
o jogo não deve fornecer dicas ao jogador, apenas habilitar a navegação pela casa
ao acessar o cômodo destino (a proposta é o segundo quarto, mas você pode mudar) informar que o jogo foi concluído com sucesso


Teste o jogo com seus amigos, refine e personalize à sua maneira. Boa sorte!
 -->
